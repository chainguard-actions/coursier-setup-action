name: Test
on:
  push:
    branches:
    - main
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
        jvm: ['17', '25']
        include:
          - os: "macos-15"
            jvm: '21'
          - os: "ubuntu-24.04-arm"
            jvm: '21'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: 24
        cache: 'npm'

    - name: Build
      shell: bash -l {0}
      run: |
        npm ci
        test "$OSTYPE" != "msys" || npm run format
        npm run all

    # test extraJvmArgs — must run before the main setup so that apps and
    # JVM are not yet cached, forcing cs to fetch over the network and hit
    # the bogus proxy
    - name: Test extraJvmArgs passes args to cs
      uses: ./
      with:
        jvm: ${{ matrix.jvm }}
        extraJvmArgs: -Dhttps.proxyHost=invalid.proxy.local -Dhttps.proxyPort=9999
      continue-on-error: true
      id: extra-jvm-args-test
    - name: Verify extraJvmArgs caused failure
      shell: bash
      env:
        OUTCOME: ${{ steps.extra-jvm-args-test.outcome }}
      run: |
        if [ "$OUTCOME" = "failure" ]; then
          echo "extraJvmArgs correctly passed to cs (proxy caused expected failure)"
        else
          echo "::error::extraJvmArgs test should have failed with bogus proxy but didn't"
          exit 1
        fi

    # create an sbt file to enable sbt caching
    - run: echo 'name := "foo"' > build.sbt
    - id: cs-setup
      uses: ./
      with:
        jvm: ${{ matrix.jvm }}
        apps: sbt sbtn ammonite bloop

    # - uses: coursier/cache-action@v5
    - name: Print cs-version
      env:
        CS_VERSION: ${{ steps.cs-setup.outputs.cs-version }}
      run: echo "cs-version=$CS_VERSION"
    - run: echo $PATH

    # test Java
    - run: echo $JAVA_HOME
    - run: java -version
    - run: cs java -version

    # test installed apps
    - run: sbtn.bat show name </dev/null
      shell: bash
      if: runner.os == 'Windows'
    - run: sbtn show name
      if: runner.os != 'Windows'
    - run: amm --help
    - run: bloop about

  test-jvm-launchers:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
        launcher: ['thin', 'assembly']
        include:
          - os: "macos-15"
            launcher: 'thin'
          - os: "macos-15"
            launcher: 'assembly'
          - os: "ubuntu-24.04-arm"
            launcher: 'thin'
          - os: "ubuntu-24.04-arm"
            launcher: 'assembly'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: 24
        cache: 'npm'

    - name: Build
      shell: bash
      run: |
        npm ci
        npm run package

    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - id: cs-setup-jvm-launcher
      uses: ./
      with:
        launcher: ${{ matrix.launcher }}
        apps: ''

    - name: Print cs-version
      env:
        CS_VERSION: ${{ steps.cs-setup-jvm-launcher.outputs.cs-version }}
      run: echo "cs-version=$CS_VERSION"
    - run: cs --help
    - run: java -version

  test-nightly:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: 24
        cache: 'npm'

    - name: Build
      shell: bash
      run: |
        npm ci
        npm run package

    - id: cs-setup-nightly
      uses: ./
      with:
        version: nightly
        apps: ''

    - name: Print cs-version
      env:
        CS_VERSION: ${{ steps.cs-setup-nightly.outputs.cs-version }}
      run: echo "cs-version=$CS_VERSION"
    - name: Verify nightly version output
      shell: bash
      env:
        CS_VERSION: ${{ steps.cs-setup-nightly.outputs.cs-version }}
      run: |
        test "$CS_VERSION" = "nightly"
    - run: cs --help
