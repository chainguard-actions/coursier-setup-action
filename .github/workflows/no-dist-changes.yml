name: Block dist changes
on:
  pull_request:

permissions:
  contents: read

jobs:
  dist-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Fail on dist changes mixed with non-dist changes
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          dist_changed=$(git diff --name-only "origin/$BASE_REF...HEAD" -- dist/)
          non_dist_changed=$(git diff --name-only "origin/$BASE_REF...HEAD" -- ':(exclude)dist/')
          if [ -n "$dist_changed" ] && [ -n "$non_dist_changed" ]; then
            echo "::error::This PR mixes changes under dist/ with changes outside of it. Files under dist/ are updated by CI and should not be committed alongside other changes."
            echo "dist/ changes:"
            echo "$dist_changed"
            exit 1
          fi
