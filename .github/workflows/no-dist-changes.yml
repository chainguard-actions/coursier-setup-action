name: Block dist changes
on:
  pull_request:

permissions: {}

jobs:
  dist-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Fail on dist changes
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD" -- dist/)
          if [ -n "$changed" ]; then
            echo "::error::Changes under dist/ are not allowed in PRs. Files under dist/ are updated by CI and don't need to be committed."
            echo "$changed"
            exit 1
          fi
