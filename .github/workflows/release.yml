name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - run: git fetch --unshallow --tags

      - name: Generate token
        id: generate-token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2
        with:
          app_id: 103842
          private_key: ${{ secrets.APP_PRIVATE_KEY }}
      - env:
          GENERATED_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          safe=$(printf '%s' "$GENERATED_TOKEN" | tr -d '\n\r')
          echo "GH_TOKEN=$safe" >> "$GITHUB_ENV"
          git config --global user.name "laughedelic[bot]"
          git config --global user.email "103842+laughedelic[bot]@users.noreply.github.com"

      - name: Install Auto
        run: |
          gh release download -R intuit/auto -p auto-linux.gz -D $HOME
          gunzip -c $HOME/auto-linux.gz > $HOME/auto
          chmod a+x $HOME/auto
          echo $HOME >> $GITHUB_PATH

      - name: Update release branch
        run: |
          git checkout release/v1
          git merge main

      - name: Build
        shell: bash -l {0}
        run: |
          nvm use lts/gallium
          npm install
          npm run all

      - name: Commit updated build
        run: |
          git add --force dist/ package-lock.json
          git status
          git commit -m 'build: update dist'
          git log -1

      - name: Create Release
        run: |
          auto latest --base-branch release/v1
