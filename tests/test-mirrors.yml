name: Test mirrors configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          apps: ''
          mirrors: |
            https://repo1.maven.org/maven2=https://repo1.maven.org/maven2
      - name: Assert cs-version output is set
        env:
          CS_VERSION: ${{ steps.action.outputs.cs-version }}
        run: |
          echo "cs-version: $CS_VERSION"
          if [ -z "$CS_VERSION" ]; then
            echo "FAIL: cs-version output is empty"
            exit 1
          fi
          echo "PASS: cs-version is '$CS_VERSION'"
      - name: Assert mirror.properties file was written
        run: |
          MIRROR_FILE="$HOME/.config/coursier/mirror.properties"
          if [ ! -f "$MIRROR_FILE" ]; then
            echo "FAIL: mirror.properties not found at $MIRROR_FILE"
            exit 1
          fi
          echo "mirror.properties contents:"
          cat "$MIRROR_FILE"
          echo "PASS: mirror.properties exists"
      - name: Assert cs is on PATH
        run: |
          which cs || { echo "FAIL: cs not found on PATH"; exit 1; }
          echo "PASS: cs is available"
