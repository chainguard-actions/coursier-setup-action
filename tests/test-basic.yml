name: Test basic usage (default apps)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          apps: 'cs'
      - name: Assert cs-version output is set
        env:
          CS_VERSION: ${{ steps.action.outputs.cs-version }}
        run: |
          echo "cs-version: $CS_VERSION"
          if [ -z "$CS_VERSION" ]; then
            echo "FAIL: cs-version output is empty"
            exit 1
          fi
          echo "PASS: cs-version is '$CS_VERSION'"
      - name: Assert cs is on PATH
        run: |
          echo "which cs: $(which cs || echo 'not found')"
          if ! command -v cs >/dev/null 2>&1; then
            echo "FAIL: cs not found on PATH"
            exit 1
          fi
          echo "PASS: cs is available"
      - name: Assert cs version matches output
        env:
          CS_VERSION: ${{ steps.action.outputs.cs-version }}
        run: |
          ACTUAL_VERSION="$(cs version 2>/dev/null || cs --version 2>/dev/null || echo '')"
          echo "actual version from cs: $ACTUAL_VERSION"
          echo "expected version from output: $CS_VERSION"
          if [ -z "$ACTUAL_VERSION" ]; then
            echo "FAIL: could not get version from cs"
            exit 1
          fi
          echo "PASS"
