name: Test JVM installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          jvm: temurin:17
          apps: ''
      - name: Assert cs-version output is set
        env:
          CS_VERSION: ${{ steps.action.outputs.cs-version }}
        run: |
          echo "cs-version: $CS_VERSION"
          if [ -z "$CS_VERSION" ]; then
            echo "FAIL: cs-version output is empty"
            exit 1
          fi
          echo "PASS: cs-version is '$CS_VERSION'"
      - name: Assert java is available
        run: |
          which java || { echo "FAIL: java not found on PATH"; exit 1; }
          java -version
          echo "PASS: java is available"
      - name: Assert java version is 17
        run: |
          JAVA_VER=$(java -version 2>&1 | head -1)
          echo "java version output: $JAVA_VER"
          if echo "$JAVA_VER" | grep -q '17'; then
            echo "PASS: java 17 detected"
          else
            echo "FAIL: expected java 17 but got: $JAVA_VER"
            exit 1
          fi
