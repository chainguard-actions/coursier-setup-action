name: Test JVM installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          jvm: temurin:17
          apps: ''
      - name: Assert cs-version output is set
        env:
          CS_VERSION: ${{ steps.action.outputs.cs-version }}
        run: |
          echo "cs-version: $CS_VERSION"
          if [ -z "$CS_VERSION" ]; then
            echo "FAIL: cs-version output is empty"
            exit 1
          fi
          echo "PASS: cs-version=$CS_VERSION"
      - name: Assert java is available
        run: |
          if ! command -v java >/dev/null 2>&1; then
            echo "FAIL: java not found on PATH"
            exit 1
          fi
          JAVA_VERSION=$(java -version 2>&1 | head -1)
          echo "java version: $JAVA_VERSION"
          echo "PASS: java found"
      - name: Assert java version is 17
        run: |
          JAVA_VER=$(java -version 2>&1 | grep -oE '"[0-9]+' | head -1 | tr -d '"')
          echo "java major version: $JAVA_VER"
          if [ "$JAVA_VER" != "17" ]; then
            echo "FAIL: expected java 17, got $JAVA_VER"
            exit 1
          fi
          echo "PASS: java 17 confirmed"
