name: Test JVM installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          jvm: 'temurin:17'
          apps: 'cs'
      - name: Assert cs-version output is set
        env:
          CS_VERSION: ${{ steps.action.outputs.cs-version }}
        run: |
          echo "cs-version: $CS_VERSION"
          if [ -z "$CS_VERSION" ]; then
            echo "FAIL: cs-version output is empty"
            exit 1
          fi
          echo "PASS: cs-version=$CS_VERSION"
      - name: Assert java is on PATH
        run: |
          if ! command -v java &>/dev/null; then
            echo "FAIL: java not found on PATH"
            exit 1
          fi
          echo "PASS: java found at $(command -v java)"
          java -version
      - name: Assert Java 17 is installed
        run: |
          JAVA_VERSION=$(java -version 2>&1 | head -1)
          echo "java version: $JAVA_VERSION"
          if ! echo "$JAVA_VERSION" | grep -q '17'; then
            echo "FAIL: expected Java 17, got: $JAVA_VERSION"
            exit 1
          fi
          echo "PASS: Java 17 confirmed"
